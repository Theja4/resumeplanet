<svg width="1600" height="900" viewBox="0 0 1600 900" fill="none" xmlns="http://www.w3.org/2000/svg">
  <rect width="1600" height="900" rx="48" fill="#F8FAF8"/>
  <rect x="70" y="80" width="420" height="720" rx="32" fill="#FFFFFF"/>
  <rect x="590" y="80" width="420" height="720" rx="32" fill="#F1FBF4"/>
  <rect x="1110" y="80" width="420" height="720" rx="32" fill="#0E1210"/>
  <text x="120" y="150" fill="#0F6B3A" font-family="Arial, sans-serif" font-size="26" font-weight="800" letter-spacing="3">1. TARGET</text>
  <text x="120" y="220" fill="#0D1117" font-family="Arial, sans-serif" font-size="52" font-weight="800">Choose the role</text>
  <text x="120" y="278" fill="#55606B" font-family="Arial, sans-serif" font-size="28">Focus on one lane, one seniority band,</text>
  <text x="120" y="316" fill="#55606B" font-family="Arial, sans-serif" font-size="28">and one problem set.</text>
  <text x="640" y="150" fill="#0F6B3A" font-family="Arial, sans-serif" font-size="26" font-weight="800" letter-spacing="3">2. TAILOR</text>
  <text x="640" y="220" fill="#0D1117" font-family="Arial, sans-serif" font-size="52" font-weight="800">Match the language</text>
  <text x="640" y="278" fill="#55606B" font-family="Arial, sans-serif" font-size="28">Use Rezoomed to align keywords, summary,</text>
  <text x="640" y="316" fill="#55606B" font-family="Arial, sans-serif" font-size="28">and impact bullets to the job description.</text>
  <text x="1160" y="150" fill="#A8F2B7" font-family="Arial, sans-serif" font-size="26" font-weight="800" letter-spacing="3">3. CONVERT</text>
  <text x="1160" y="220" fill="#FFFFFF" font-family="Arial, sans-serif" font-size="52" font-weight="800">Win the interview</text>
  <text x="1160" y="278" fill="#D7DDD8" font-family="Arial, sans-serif" font-size="28">Sharper ATS fit and clearer evidence</text>
  <text x="1160" y="316" fill="#D7DDD8" font-family="Arial, sans-serif" font-size="28">increase recruiter confidence.</text>
  <circle cx="530" cy="440" r="16" fill="#0F6B3A"/>
  <circle cx="1050" cy="440" r="16" fill="#0F6B3A"/>
  <path d="M490 440H570" stroke="#0F6B3A" stroke-width="8" stroke-linecap="round"/>
  <path d="M1010 440H1090" stroke="#0F6B3A" stroke-width="8" stroke-linecap="round"/>
</svg>
