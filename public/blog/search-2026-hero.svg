  <circle cx="250" cy="170" r="180" fill="#DDF8E7"/>
  <rect x="100" y="120" width="560" height="280" rx="28" fill="#FFFFFF" fill-opacity="0.96"/>
  <text x="140" y="188" fill="#0D1117" font-family="Arial, sans-serif" font-size="68" font-weight="800">2026 Job Search</text>
  <text x="140" y="262" fill="#0F6B3A" font-family="Arial, sans-serif" font-size="38" font-weight="700">Sharper positioning. Better ATS fit.</text>
  <text x="140" y="320" fill="#48525C" font-family="Arial, sans-serif" font-size="28">Rezoomed helps candidates tailor faster</text>
  <text x="140" y="358" fill="#48525C" font-family="Arial, sans-serif" font-size="28">and convert more applications into interviews.</text>
  <rect x="920" y="160" width="500" height="340" rx="32" fill="#0F6B3A"/>
  <rect x="970" y="220" width="270" height="22" rx="11" fill="#D9FBE1"/>
  <rect x="970" y="270" width="340" height="18" rx="9" fill="#A8F2B7"/>
  <rect x="970" y="310" width="300" height="18" rx="9" fill="#A8F2B7"/>
  <rect x="970" y="350" width="370" height="18" rx="9" fill="#A8F2B7"/>
  <rect x="970" y="404" width="210" height="58" rx="18" fill="#FFFFFF"/>
  <text x="1010" y="442" fill="#0F6B3A" font-family="Arial, sans-serif" font-size="30" font-weight="800">ATS 92</text>
  <rect x="110" y="520" width="1380" height="240" rx="32" fill="#FFFFFF" fill-opacity="0.94"/>
  <text x="150" y="588" fill="#0F6B3A" font-family="Arial, sans-serif" font-size="22" font-weight="800" letter-spacing="3">REZOOMED</text>
  <text x="150" y="640" fill="#0D1117" font-family="Arial, sans-serif" font-size="54" font-weight="800">Modern job search is a systems problem.</text>
  <text x="150" y="694" fill="#55606B" font-family="Arial, sans-serif" font-size="30">Run ATS checks, tailor per role, and keep separate versions without losing clarity.</text>
  <defs>
    <linearGradient id="bg1" x1="60" y1="80" x2="1500" y2="840" gradientUnits="userSpaceOnUse">
      <stop stop-color="#ECFAF0"/>
      <stop offset="1" stop-color="#FFFFFF"/>
    </linearGradient>
  </defs>
